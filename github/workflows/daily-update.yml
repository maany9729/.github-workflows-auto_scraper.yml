name: Automated Daily Content Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Gemini Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-content.js

      - name: Commit and Push Updated Content
        run: |
          git config --global user.name "CreatorSuite AI Bot"
          git config --global user.email "bot@creatorsuite.ai"
          git add data/content.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update daily content [skip ci]" && git push)
